name: Deploy Weather App to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Install Project Dependencies
        run: npm install
        working-directory: ./app

      - name: Create Environment Files
        run: |
          mkdir -p src/environments
          WEATHER_CONTENT="export const environment = { 
            production: true, 
            apiKey: '${{ secrets.WEATHER_API_KEY }}', 
            apiUrl: 'https://api.openweathermap.org/data/2.5/weather', 
            iconUrl: 'https://openweathermap.org/img/wn' 
          };"
          MAIN_CONTENT="export const environment = { production: true };"
          
          echo "$WEATHER_CONTENT" > src/environments/environment.weather.ts
          echo "$WEATHER_CONTENT" > src/environments/environment.weather.prod.ts
          echo "$MAIN_CONTENT" > src/environments/environment.ts
          echo "$MAIN_CONTENT" > src/environments/environment.prod.ts
        working-directory: ./app

      - name: Pull Vercel Environment Info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./app
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Use Vercel's build command instead of 'ng build'
      # This creates the .vercel/output folder that the next step requires
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./app
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./app
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}